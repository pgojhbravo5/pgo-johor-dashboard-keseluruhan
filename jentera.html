<!DOCTYPE html>
<html lang="ms">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, minimum-scale=0.5, maximum-scale=3.0, user-scalable=yes"
    />
    <title>DASHBOARD JENTERA BOMBA NEGERI JOHOR</title>
    <script src="https://cdn.tailwindcss.com">
    </script>
    <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <script src="https://cdn.jsdelivr.net/npm/chart.js">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2">
    </script>
    <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Orbitron:wght@600;800;900&display=swap"
    rel="stylesheet"
    />

    <style>
      :root {
        --bg-main: #0f172a;
        --bg-card: #1e293b;
        --bg-card-alt: #0d1527;
        --bg-header: #0f172a;
        --bg-input: #0f172a;
        --bg-table-header: rgba(15, 23, 42, 0.8);
        --bg-modal: #0f172a;
        --border-color: #334155;
        --border-light: rgba(51, 65, 85, 0.5);
        --text-primary: #f8fafc;
        --text-secondary: #94a3b8;
        --text-muted: #64748b;
        --accent-red: #ef4444;
        --accent-blue: #3b82f6;
        --accent-cyan: #06b6d4;
        --shadow-color: rgba(0, 0, 0, 0.6);
        --overlay-bg: rgba(15, 23, 42, 0.82);
        --card-hover-bg: #334155;
      }

      body.light-mode {
        --bg-main: #f1f5f9;
        --bg-card: #ffffff;
        --bg-card-alt: #f8fafc;
        --bg-header: #ffffff;
        --bg-input: #ffffff;
        --bg-table-header: #f1f5f9;
        --bg-modal: #ffffff;
        --border-color: #e2e8f0;
        --border-light: rgba(203, 213, 225, 0.8);
        --text-primary: #1e293b;
        --text-secondary: #475569;
        --text-muted: #94a3b8;
        --shadow-color: rgba(0, 0, 0, 0.1);
        --overlay-bg: rgba(241, 245, 249, 0.9);
        --card-hover-bg: #f1f5f9;
      }

      body {
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        background-color: var(--bg-main);
        color: var(--text-primary);
        overflow-x: hidden;
        background-image: url('https://raw.githubusercontent.com/pgojhbravo5/DASHBOARD-DATA-JENTERA-JBPM-JOHOR/ce5530ee5e69d80d7b478a2af4919f7c243f3800/firetruck-BG.png');
        background-size: cover;
        background-position: center;
        background-attachment: fixed;
        background-repeat: no-repeat;
        position: relative;
        transition: background-color 0.3s ease, color 0.3s ease;
      }

      body::before {
        content: '';
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: var(--overlay-bg);
        z-index: -1;
        pointer-events: none;
        transition: background 0.3s ease;
      }

      body.light-mode {
        background-image: none;
      }
      body.light-mode::before {
        background: rgba(241, 245, 249, 0.7);
      }

      @keyframes sirenRed {
        0%,
        100% {
          box-shadow: 0 0 4px #ef4444, 0 0 12px #ef4444;
          opacity: 1;
        }
        50% {
          box-shadow: 0 0 1px #ef4444;
          opacity: 0.3;
        }
      }
      @keyframes sirenBlue {
        0%,
        100% {
          box-shadow: 0 0 1px #3b82f6;
          opacity: 0.3;
        }
        50% {
          box-shadow: 0 0 4px #3b82f6, 0 0 12px #3b82f6;
          opacity: 1;
        }
      }
      @keyframes sirenAmber {
        0%,
        100% {
          box-shadow: 0 0 4px #f59e0b, 0 0 12px #f59e0b;
          opacity: 1;
        }
        50% {
          box-shadow: 0 0 2px #f59e0b;
          opacity: 0.4;
        }
      }

      .siren-red {
        animation: sirenRed 0.8s infinite alternate;
      }
      .siren-blue {
        animation: sirenBlue 0.8s infinite alternate;
      }
      .siren-amber {
        animation: sirenAmber 0.9s infinite alternate;
      }

      @keyframes wheelSpin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
      .jentera-card:hover .wheel-spin,
      .vehicle-shape-modal:hover .wheel-spin {
        animation: wheelSpin 1.5s linear infinite;
      }

      @keyframes pulseGlow {
        0%,
        100% {
          box-shadow: 0 0 2px currentColor;
        }
        50% {
          box-shadow: 0 0 8px currentColor, 0 0 14px currentColor;
        }
      }
      .pulse-glow-b {
        animation: pulseGlow 2s infinite;
        color: #22c55e;
      }
      .pulse-glow-rm {
        animation: pulseGlow 2s infinite;
        color: #eab308;
      }
      .pulse-glow-r {
        animation: pulseGlow 1s infinite;
        color: #ef4444;
      }
      .pulse-glow-d {
        animation: pulseGlow 2.5s infinite;
        color: #3b82f6;
      }

      .jentera-card {
        transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      }
      .jentera-card:hover {
        transform: translateY(-2px) scale(1.02);
        border-color: #64748b;
        box-shadow: 0 6px 20px var(--shadow-color),
          0 0 12px rgba(239, 68, 68, 0.2);
        z-index: 10;
      }

      @keyframes bellShake {
        0%,
        100% {
          transform: rotate(0deg);
        }
        10%,
        30%,
        50%,
        70%,
        90% {
          transform: rotate(-5deg);
        }
        20%,
        40%,
        60%,
        80% {
          transform: rotate(5deg);
        }
      }
      .bell-animate {
        animation: bellShake 2s ease-in-out infinite;
      }

      ::-webkit-scrollbar {
        width: 5px;
        height: 5px;
      }
      ::-webkit-scrollbar-track {
        background: var(--bg-main);
      }
      ::-webkit-scrollbar-thumb {
        background: #334155;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #475569;
      }

      .ms-dropdown {
        position: relative;
        display: inline-block;
      }
      .ms-select-btn {
        background-color: var(--bg-input);
        border: 1px solid var(--border-color);
        color: var(--text-primary);
        padding: 0.35rem 0.65rem;
        border-radius: 0.375rem;
        font-size: 0.75rem;
        font-weight: 500;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.5rem;
        min-width: 130px;
        transition: all 0.2s;
      }
      .ms-select-btn:hover {
        border-color: #64748b;
      }
      .ms-options {
        display: none;
        position: absolute;
        top: 100%;
        left: 0;
        margin-top: 0.25rem;
        background-color: var(--bg-card);
        border: 1px solid var(--border-color);
        border-radius: 0.375rem;
        z-index: 50;
        min-width: 190px;
        max-height: 220px;
        overflow-y: auto;
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        padding: 0.375rem;
      }
      .ms-options.show {
        display: block;
      }
      .ms-option {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.35rem 0.5rem;
        border-radius: 0.25rem;
        cursor: pointer;
        font-size: 0.75rem;
        color: var(--text-secondary);
        transition: background 0.15s;
        user-select: none;
      }
      .ms-option:hover {
        background-color: var(--card-hover-bg);
        color: var(--text-primary);
      }
      .ms-option input[type='checkbox'] {
        accent-color: #ef4444;
        width: 0.875rem;
        height: 0.875rem;
        cursor: pointer;
      }
      .ms-option input[type='checkbox']:not(:checked)~span {
        text-decoration: line-through;
        opacity: 0.5;
      }
      .ms-option input[type='checkbox']:checked~span {
        text-decoration: none;
        opacity: 1;
      }

      .badge-status {
        padding: 0.15rem 0.4rem;
        border-radius: 0.25rem;
        font-size: 0.65rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.025em;
        display: inline-block;
      }
      .badge-baik {
        background-color: rgba(34, 197, 94, 0.2);
        color: #4ade80;
        border: 1px solid rgba(34, 197, 94, 0.4);
      }
      .badge-minor {
        background-color: rgba(234, 179, 8, 0.2);
        color: #fde047;
        border: 1px solid rgba(234, 179, 8, 0.4);
      }
      .badge-rosak {
        background-color: rgba(239, 68, 68, 0.2);
        color: #fca5a5;
        border: 1px solid rgba(239, 68, 68, 0.4);
      }
      .badge-pulang {
        background-color: rgba(59, 130, 246, 0.2);
        color: #93c5fd;
        border: 1px solid rgba(59, 130, 246, 0.4);
      }
      .badge-unknown {
        background-color: rgba(148, 163, 184, 0.2);
        color: #cbd5e1;
        border: 1px solid rgba(148, 163, 184, 0.4);
      }

      .plate-number {
        background-color: #000000;
        color: #ffffff;
        border: 1px solid #9ca3af;
        border-radius: 0.2rem;
        padding: 0.05rem 0.3rem;
        font-family: Arial, Helvetica, sans-serif;
        font-weight: 700;
        letter-spacing: 0.3px;
        box-shadow: inset 0 0 2px rgba(255, 255, 255, 0.2),
          0 1px 3px rgba(0, 0, 0, 0.5);
        display: inline-block;
        font-size: 0.72rem;
        text-shadow: none;
        line-height: 1.15;
      }
      
      .jentera-card {
        background-color: var(--bg-card-alt);
        border: 1px solid var(--border-color);
        border-radius: 0.375rem;
        padding: 0.35rem 0.45rem;
        cursor: pointer;
        display: flex;
        flex-direction: column;
        gap: 0.2rem;
        position: relative;
        overflow: hidden;
        min-width: 0;
      }
      .jentera-card.status-glow-b {
        border-left: 3px solid #22c55e;
      }
      .jentera-card.status-glow-rm {
        border-left: 3px solid #eab308;
      }
      .jentera-card.status-glow-r {
        border-left: 3px solid #ef4444;
      }
      .jentera-card.status-glow-d {
        border-left: 3px solid #3b82f6;
      }
      .jentera-card.status-glow-u {
        border-left: 3px solid #94a3b8;
      }
      .jentera-card.type-cfrt {
        border-top: 1.5px solid var(--accent-red);
      }
      .jentera-card.type-emrs {
        border-top: 1.5px solid var(--accent-blue);
      }
      .jentera-card.type-water {
        border-top: 1.5px solid var(--accent-cyan);
      }

      .copy-btn {
        position: absolute;
        top: 0.15rem;
        right: 0.15rem;
        width: 16px;
        height: 16px;
        background: rgba(15, 23, 42, 0.9);
        border: 1px solid var(--border-color);
        border-radius: 0.2rem;
        color: #94a3b8;
        font-size: 8px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0;
        transition: all 0.15s ease;
        z-index: 5;
      }
      /* FIX BUG #3: Tampakkan butang salin di telefon */
      @media (max-width: 768px) {
        .copy-btn {
          opacity: 0.7 !important;
          width: 22px;
          height: 22px;
          font-size: 11px;
        }
        .copy-btn:hover {
          opacity: 1 !important;
        }
      }
      .jentera-card:hover .copy-btn,
      tr:hover .copy-btn {
        opacity: 1;
      }
      .copy-btn:hover {
        background: #334155;
        color: #fff;
        border-color: #64748b;
      }
      .copy-btn.copied {
        background: #22c55e !important;
        border-color: #22c55e !important;
        color: #fff !important;
      }

      body.fullscreen-mode .tab-nav-header,
      body.fullscreen-mode .sub-header-controls {
        display: none !important;
      }
      body.fullscreen-mode #zoneContainer {
        gap: 0.5rem;
      }

      .modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.9);
        backdrop-filter: blur(8px);
        z-index: 100;
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.3s ease;
        padding: 1rem;
      }
      .modal-overlay.show {
        opacity: 1;
        pointer-events: auto;
      }

      .vehicle-shape-modal {
        position: relative;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        user-select: none;
        overflow-y: auto;
        max-height: 90vh;
        width: 100%;
      }

      .vehicle-illustration {
        position: relative;
        background: linear-gradient(180deg,
            rgba(30, 41, 59, 0.9) 0%,
            rgba(15, 23, 42, 0.95) 100%);
        border-radius: 1rem;
        padding: 1rem;
        border: 1px solid rgba(148, 163, 184, 0.2);
      }
      .vehicle-body {
        background: linear-gradient(180deg,
            #cbd5e1 0%,
            #64748b 50%,
            #334155 100%);
        border-radius: 0.75rem 0.75rem 0.25rem 0.25rem;
        position: relative;
        min-height: 60px;
      }
      .vehicle-cabin {
        background: linear-gradient(180deg, #94a3b8 0%, #475569 100%);
        border-radius: 0.5rem 0.5rem 0 0;
        position: absolute;
        top: -20px;
        height: 30px;
      }
      .vehicle-window {
        background: linear-gradient(180deg, #38bdf8 0%, #0284c7 100%);
        border-radius: 0.25rem;
        border: 1px solid #1e293b;
      }
      .vehicle-light-bar {
        height: 6px;
        border-radius: 3px;
        margin-bottom: 4px;
      }
      .vehicle-hose {
        background: linear-gradient(180deg, #94a3b8 0%, #475569 100%);
        border-radius: 50%;
        position: relative;
      }
      .vehicle-ladder {
        background: linear-gradient(180deg, #cbd5e1 0%, #64748b 100%);
        border-radius: 2px;
      }

      .header-bg {
        background-color: var(--bg-header);
        border-color: var(--border-color);
      }
      .nav-bg {
        background-color: var(--bg-header);
        border-color: var(--border-color);
      }
      .card-bg {
        background-color: var(--bg-card);
        border-color: var(--border-color);
      }
      .table-header-bg {
        background-color: var(--bg-table-header);
      }
      .input-bg {
        background-color: var(--bg-input);
        border-color: var(--border-color);
        color: var(--text-primary);
      }
      .text-secondary-custom {
        color: var(--text-secondary);
      }
      .text-muted-custom {
        color: var(--text-muted);
      }
      .border-custom {
        border-color: var(--border-color);
      }

      /* ============================================================
         BUTANG HEADER (Kemaskini, Siang/Malam, Print, Kembali)
         Saiz seragam di desktop & mobile
      ============================================================ */
      .header-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.35rem;
        height: 34px;
        min-width: 34px;
        padding: 0 0.75rem;
        border-radius: 0.5rem;
        font-size: 0.75rem;
        font-weight: 700;
        line-height: 1;
        white-space: nowrap;
        text-decoration: none;
        cursor: pointer;
        transition: all 0.2s ease;
        box-sizing: border-box;
      }
      .header-btn.header-btn-icon {
        width: 34px;
        padding: 0;
      }
      @media (max-width: 639px) {
        .header-btn {
          width: 34px;
          padding: 0;
        }
        .header-btn .btn-label {
          display: none;
        }
      }

      @page {
        margin: 1.5cm 1cm 2cm 1cm;
        size: A4 landscape;
      }

      @media print {
        html,
        body {
          background: white !important;
          background-image: none !important;
          color: #000 !important;
          margin: 0 !important;
          padding: 0 !important;
          width: 100% !important;
          height: auto !important;
          overflow: visible !important;
        }
        body::before {
          display: none !important;
        }
        body,
        body.light-mode,
        body.dark-mode {
          --text-primary: #000 !important;
          --text-secondary: #333 !important;
          --bg-main: #fff !important;
          --bg-card: #fff !important;
          --bg-header: #fff !important;
          --border-color: #ccc !important;
          --bg-input: #fff !important;
          --bg-table-header: #e5e7eb !important;
          --bg-card-alt: #fff !important;
        }
        header,
        nav,
        .tab-nav-header,
        .sub-header-controls,
        footer,
        #loadingOverlay,
        #toastNotification,
        #modalOverlay,
        .copy-btn,
        .ms-dropdown,
        #dashboardFilters,
        button:not(.keep-in-print),
        .tab-btn,
        [class*='sticky'] {
          display: none !important;
          height: 0 !important;
          min-height: 0 !important;
          max-height: 0 !important;
          margin: 0 !important;
          padding: 0 !important;
          overflow: hidden !important;
          position: static !important;
          visibility: hidden !important;
        }
        .print-header {
          display: block !important;
          visibility: visible !important;
          text-align: center !important;
          margin-top: 0 !important;
          margin-bottom: 15px !important;
          padding-top: 0 !important;
          padding-bottom: 8px !important;
          border-bottom: 2px solid #000 !important;
          height: auto !important;
        }
        .print-header .print-title {
          font-size: 16pt !important;
          font-weight: bold !important;
          color: #000 !important;
          text-transform: uppercase !important;
        }
        .print-header .print-subtitle {
          font-size: 10pt !important;
          color: #333 !important;
          margin-top: 5px !important;
        }
        body {
          padding: 0 !important;
          margin: 0 !important;
        }
        main {
          display: block !important;
          visibility: visible !important;
          margin: 0 !important;
          padding: 0 15px !important;
          width: 100% !important;
          height: auto !important;
          overflow: visible !important;
        }
        .tab-content {
          display: block !important;
          visibility: visible !important;
          page-break-inside: avoid;
          height: auto !important;
          overflow: visible !important;
        }
        .tab-content.hidden {
          display: block !important;
          visibility: visible !important;
        }
        canvas {
          display: block !important;
          visibility: visible !important;
          max-width: 100% !important;
          height: auto !important;
          page-break-inside: avoid;
        }
        [class*='h-48'],
        [class*='h-'] {
          height: auto !important;
          min-height: 200px !important;
          overflow: visible !important;
        }
        table {
          border: 1px solid #000 !important;
          border-collapse: collapse !important;
          width: 100% !important;
          font-size: 8pt !important;
          visibility: visible !important;
        }
        th {
          background: #e5e7eb !important;
          color: #000 !important;
          font-weight: bold !important;
          border: 1px solid #000 !important;
          padding: 4px !important;
        }
        td {
          border: 1px solid #ccc !important;
          color: #000 !important;
          padding: 4px !important;
        }
        tbody,
        tr,
        td,
        th {
          visibility: visible !important;
        }
        .jentera-card,
        [class*='bg-slate-800'],
        [class*='bg-slate-900'],
        [cl
